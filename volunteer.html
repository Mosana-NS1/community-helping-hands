    <hr>

    <main>

        <section class="welcome">

            <h2>Become a Volunteer</h2>

            
            <p>
        <img src="images/volunteer.jpg"
            alt="Goal-Zone Soccer Logo"
            width="490">
    </p>


            <p>
                If you would like to help your community,
                complete the form below.
            </p>

            <br>


            <form id="volunteerForm">

                <p>

                    <label for="name">
                        Full Name:
                    </label>

                    <br>

                    <input type="text"
                           id="name"
                           name="name"
                           required>

                </p>

                <br>


                <p>

                    <label for="email">
                        Email Address:
                    </label>

                    <br>

                    <input type="email"
                           id="email"
                           name="email"
                           required>

                </p>

                <br>


                <p>

                    <label for="programme">
                        Programme:
                    </label>

                    <br>

                    <select id="programme"
                            name="programme">

                        <option value="food">
                            Food Donations
                        </option>

                        <option value="clothing">
                            Clothing Drives
                        </option>

                        <option value="education">
                            Education Support
                        </option>

                    </select>

                </p>

                <br>


                <button type="submit">
                    Submit
                </button>

            </form>

        </section>

    </main>
