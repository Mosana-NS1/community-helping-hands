            </ul>

        </nav>

    </header>


    <main>

        <section class="welcome">

            <h2>Contact Us</h2>

            <p>
                We would love to hear from you.
            </p>

            <br>

            <p>
                <strong>Email:</strong>
                info@communityhelpinghands.org
            </p>

            <p>
                <strong>Phone:</strong>
                012 345 6789
            </p>

            <p>
                <strong>Location:</strong>
                Johannesburg, South Africa
            </p>

            <br>


            <form>

                <p>

                    <label for="contactName">
                        Your Name:
                    </label>

                    <br>

                    <input type="text"
                           id="contactName"
                           required>

                </p>

                <br>


                <p>

                    <label for="contactEmail">
                        Your Email:
                    </label>

                    <br>

                    <input type="email"
                           id="contactEmail"
                           required>

                </p>

                <br>


                <p>

                    <label for="message">
                        Message:
                    </label>

                    <br>

                    <textarea id="message"
                              rows="6"
                              cols="40"
                              required></textarea>

                </p>

                <br>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <footer>
